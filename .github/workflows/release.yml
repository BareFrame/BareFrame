name: Build & Sign Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies & Electron binary
        run: |
          npm install --no-audit --no-fund
          node node_modules/electron/install.js

      - name: Build Windows installers
        run: npm run build

      # Signs Setup & Portable EXEs using Microsoft Azure Trusted Signing
      # Add AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
      # AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE
      # to your GitHub Repository Secrets.
      - name: Check signing configuration
        id: sign_check
        shell: pwsh
        env:
          HAS_AZURE_SIGN: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
        run: |
          if ($env:HAS_AZURE_SIGN) { "enabled=true" >> $env:GITHUB_OUTPUT } else { "enabled=false" >> $env:GITHUB_OUTPUT }

      - name: Sign Windows installers (Azure Trusted Signing)
        if: steps.sign_check.outputs.enabled == 'true'
        uses: azure/trusted-signing-action@v0.5.10
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: BareFrame ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/BareFrame-Setup.exe
            dist/BareFrame-Portable.exe
